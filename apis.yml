name: Webster Bank
kind: company
description: >-
  Webster Bank, N.A. is a nationally chartered commercial bank (National
  Association) and the principal banking subsidiary of Webster Financial
  Corporation (NYSE: WBS), a Delaware-incorporated bank and financial holding
  company headquartered in Stamford, Connecticut. A values-based super-regional
  institution with roughly $84 billion in assets, Webster serves businesses,
  individuals, and families across the Northeast from the New York City metro
  area through Connecticut, Rhode Island, and Massachusetts, and operates the
  HSA Bank division, a leading national provider of health savings accounts and
  consumer-directed benefit administration in all 50 states. Webster does not
  publish a first-party public developer portal or downloadable API
  specifications. Its open-finance posture is consumer- and commercial-permissioned
  data sharing delivered through aggregators rather than a direct API: in June
  2026 Webster went live on Prolific Banking's FI-Streams Connector using Plaid's
  FDX-aligned Core Exchange specification to give commercial clients secure,
  tokenized connectivity to the Plaid network, and consumer account data is also
  reachable via Plaid and Finicity. There is no publicly documented first-party
  REST API, OpenAPI/Swagger definition, or self-serve developer program.
